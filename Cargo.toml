[workspace]
members = [".", "crates/ocr", "crates/overlay", "crates/translation"]
resolver = "3"

[package]
name = "cosmic-screenshot"
version = "1.11.0"
edition = "2024"
description = "Screenshot utility that translates the captured text in place (DeepL + Tesseract)"

[[bin]]
name = "cosmic-screenshot-translate"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:iced"]

[dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
jiff = "0.2"
dirs = "6"
tokio = { version = "1.52.1", default-features = false, features = ["macros"] }
clap = { version = "4.6.1", features = ["derive"] }
zbus = { version = "5", default-features = false }

# Translation pipeline
cosmic-screenshot-ocr = { path = "crates/ocr" }
cosmic-screenshot-overlay = { path = "crates/overlay" }
cosmic-screenshot-translation = { path = "crates/translation" }

# Preview window (the Translate button + target-language picker)
iced = { version = "0.13", default-features = false, features = [
    "advanced",
    "image",
    "tiny-skia",
    "tokio",
], optional = true }

# Internationalization
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8.11"

[dev-dependencies]
ab_glyph = "0.2"
serde_json = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
